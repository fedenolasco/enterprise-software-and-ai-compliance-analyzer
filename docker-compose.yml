services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: compliance-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5.21
    container_name: compliance-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH}
    ports:
      - "${NEO4J_PORT}:7474"
      - "${NEO4J_BOLT_PORT}:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20

  phoenix:
    image: arizephoenix/phoenix:version-4.2.2
    container_name: compliance-phoenix
    restart: unless-stopped
    profiles:
      - observability
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
    ports:
      - "${PHOENIX_PORT}:6006"
      - "${PHOENIX_GRPC_PORT}:4317"
    volumes:
      - phoenix_data:/mnt/data

  langfuse-postgres:
    image: postgres:16.4
    container_name: compliance-langfuse-postgres
    restart: unless-stopped
    profiles:
      - observability
    environment:
      POSTGRES_DB: ${LANGFUSE_POSTGRES_DB}
      POSTGRES_USER: ${LANGFUSE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${LANGFUSE_POSTGRES_PASSWORD}
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LANGFUSE_POSTGRES_USER} -d ${LANGFUSE_POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  langfuse-clickhouse:
    image: clickhouse/clickhouse-server:24.3.13.40-alpine
    container_name: compliance-langfuse-clickhouse
    restart: unless-stopped
    profiles:
      - observability
    environment:
      CLICKHOUSE_DB: ${LANGFUSE_CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${LANGFUSE_CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD}
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  langfuse-redis:
    image: redis:7.2.5-alpine
    container_name: compliance-langfuse-redis
    restart: unless-stopped
    profiles:
      - observability
    command: redis-server --requirepass ${LANGFUSE_REDIS_PASSWORD}
    volumes:
      - langfuse_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${LANGFUSE_REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  langfuse-minio:
    image: minio/minio:RELEASE.2024-07-16T23-46-41Z
    container_name: compliance-langfuse-minio
    restart: unless-stopped
    profiles:
      - observability
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${LANGFUSE_MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${LANGFUSE_MINIO_ROOT_PASSWORD}
    ports:
      - "${LANGFUSE_MINIO_PORT}:9000"
      - "${LANGFUSE_MINIO_CONSOLE_PORT}:9001"
    volumes:
      - langfuse_minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  langfuse-minio-create-bucket:
    image: minio/mc:RELEASE.2024-07-15T19-02-30Z
    container_name: compliance-langfuse-minio-create-bucket
    profiles:
      - observability
    depends_on:
      langfuse-minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set langfuse-minio http://langfuse-minio:9000 ${LANGFUSE_MINIO_ROOT_USER} ${LANGFUSE_MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing langfuse-minio/${LANGFUSE_S3_EVENT_UPLOAD_BUCKET}
      "

  langfuse:
    image: langfuse/langfuse:3
    container_name: compliance-langfuse
    restart: unless-stopped
    profiles:
      - observability
    depends_on:
      langfuse-postgres:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
      langfuse-minio-create-bucket:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${LANGFUSE_POSTGRES_USER}:${LANGFUSE_POSTGRES_PASSWORD}@langfuse-postgres:5432/${LANGFUSE_POSTGRES_DB}
      NEXTAUTH_URL: ${LANGFUSE_HOST}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      SALT: ${LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
      TELEMETRY_ENABLED: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://${LANGFUSE_CLICKHOUSE_USER}:${LANGFUSE_CLICKHOUSE_PASSWORD}@langfuse-clickhouse:9000/${LANGFUSE_CLICKHOUSE_DB}
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_USER: ${LANGFUSE_CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: ${LANGFUSE_CLICKHOUSE_DB}
      REDIS_CONNECTION_STRING: redis://:${LANGFUSE_REDIS_PASSWORD}@langfuse-redis:6379/0
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: ${LANGFUSE_S3_EVENT_UPLOAD_BUCKET}
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_MINIO_ROOT_USER}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
    ports:
      - "${LANGFUSE_PORT}:3000"

  langfuse-worker:
    image: langfuse/langfuse-worker:3
    container_name: compliance-langfuse-worker
    restart: unless-stopped
    profiles:
      - observability
    depends_on:
      langfuse-postgres:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
      langfuse-minio-create-bucket:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${LANGFUSE_POSTGRES_USER}:${LANGFUSE_POSTGRES_PASSWORD}@langfuse-postgres:5432/${LANGFUSE_POSTGRES_DB}
      NEXTAUTH_URL: ${LANGFUSE_HOST}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      SALT: ${LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
      TELEMETRY_ENABLED: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://${LANGFUSE_CLICKHOUSE_USER}:${LANGFUSE_CLICKHOUSE_PASSWORD}@langfuse-clickhouse:9000/${LANGFUSE_CLICKHOUSE_DB}
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_USER: ${LANGFUSE_CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: ${LANGFUSE_CLICKHOUSE_DB}
      REDIS_CONNECTION_STRING: redis://:${LANGFUSE_REDIS_PASSWORD}@langfuse-redis:6379/0
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: ${LANGFUSE_S3_EVENT_UPLOAD_BUCKET}
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_MINIO_ROOT_USER}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"

  openvino-model-server:
    image: openvino/model_server:2026.2-gpu
    container_name: compliance-openvino-model-server
    restart: unless-stopped
    profiles:
      - openvino
    ports:
      - "${OPENVINO_PORT:-8100}:8000"
    volumes:
      - openvino_models:/models
      - openvino_cache:/cache
    # NPU passthrough works on Linux/WSL hosts with Intel NPU devices exposed.
    # On native Windows, use the OpenVINO Model Server bare-metal package if Docker
    # device passthrough is unavailable.
    devices:
      - /dev/accel:/dev/accel
    command: >
      --rest_port 8000
      --model_repository_path /models
      --source_model ${OPENVINO_MODEL:-OpenVINO/Qwen3-8B-int4-cw-ov}
      --task text_generation
      --target_device ${OPENVINO_DEVICE:-NPU}
      --cache_dir /cache
      --model_name ${OPENVINO_MODEL_NAME:-openvino-local-llm}

  openvino-model-server-cpu:
    image: openvino/model_server:2026.2
    container_name: compliance-openvino-model-server-cpu
    restart: unless-stopped
    profiles:
      - openvino-cpu
    ports:
      - "${OPENVINO_PORT:-8100}:8000"
    volumes:
      - openvino_models:/models
      - openvino_cache:/cache
    command: >
      --rest_port 8000
      --model_repository_path /models
      --source_model ${OPENVINO_MODEL:-OpenVINO/Qwen3-8B-int4-cw-ov}
      --task text_generation
      --target_device CPU
      --cache_dir /cache
      --model_name ${OPENVINO_MODEL_NAME:-openvino-local-llm}

  ui-backend:
    build:
      context: ./ui/backend
      dockerfile: Dockerfile
    container_name: compliance-ui-backend
    restart: unless-stopped
    profiles:
      - ui
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=${NEO4J_USERNAME}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - MOCK_PRICING_API_URL=http://mock-pricing-api:8000
      - UI_API_HOST=0.0.0.0
      - UI_API_PORT=3001
      - CORS_ORIGINS=http://localhost:3000
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  ui-frontend:
    build:
      context: ./ui/frontend
      dockerfile: Dockerfile
    container_name: compliance-ui-frontend
    restart: unless-stopped
    profiles:
      - ui
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      - ui-backend

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  phoenix_data:
  langfuse_postgres_data:
  langfuse_clickhouse_data:
  langfuse_clickhouse_logs:
  langfuse_redis_data:
  langfuse_minio_data:
  openvino_models:
  openvino_cache:
