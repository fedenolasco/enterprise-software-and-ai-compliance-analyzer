[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "agent-brain"
version = "0.1.0"
description = "Local hybrid retrieval and agent orchestration layer for the Enterprise Software & AI Compliance Analyzer."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Enterprise Software & AI Compliance Analyzer" }
]
dependencies = [
  "langgraph==1.0.8",
  "neo4j==5.21.0",
  "openai==1.106.1",
  "psycopg[binary]==3.2.13",
  "python-dotenv==1.0.1",
  "rich==13.9.4"
]

[project.optional-dependencies]
dev = [
  "mypy==1.14.1",
  "pytest==8.3.4",
  "ruff==0.9.2"
]
notebook = [
  "ipykernel==6.29.5",
  "jupyterlab==4.3.5"
]

[project.scripts]
agent-brain-validate = "agent_brain.cli.validate_scaffold:main"
agent-brain-project-graph = "agent_brain.cli.project_graph:main"
agent-brain-search-vectors = "agent_brain.cli.search_vectors:main"
agent-brain-traverse-graph = "agent_brain.cli.traverse_graph:main"
agent-brain-hybrid-retrieve = "agent_brain.cli.hybrid_retrieve:main"
agent-brain-run-curated-demo = "agent_brain.cli.run_curated_demo:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_brain"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
