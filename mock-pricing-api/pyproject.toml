[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "mock-pricing-api"
version = "0.1.0"
description = "Local FastAPI mock pricing service for the Enterprise Software & AI Compliance Analyzer."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
  { name = "Enterprise Software & AI Compliance Analyzer" }
]
dependencies = [
  "fastapi==0.136.3",
  "pydantic==2.13.4",
  "python-dotenv==1.0.1",
  "uvicorn==0.49.0"
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "mypy==1.14.1",
  "pytest==8.3.4",
  "ruff==0.9.2"
]

[project.scripts]
mock-pricing-api = "mock_pricing_api.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mock_pricing_api"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
