[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ui-api"
version = "0.1.0"
description = "FastAPI backend for the Enterprise Software & AI Compliance Analyzer UI."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "MIT"
authors = [
  { name = "Enterprise Software & AI Compliance Analyzer" }
]
dependencies = [
  "fastapi==0.115.0",
  "foundry-local-sdk-winml==1.2.3; platform_system == 'Windows'",
  "foundry-local-sdk==1.2.3; platform_system != 'Windows'",
  "uvicorn[standard]==0.34.0",
  "websockets==14.0",
  "httpx==0.28.1",
  "psycopg[binary]==3.2.13",
  "neo4j==5.21.0",
  "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = [
  "mypy==1.14.1",
  "pytest==8.3.4",
  "pytest-asyncio==0.24.0",
  "httpx==0.28.1",
  "ruff==0.9.2"
]

[project.scripts]
ui-api = "ui_api.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ui_api"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
